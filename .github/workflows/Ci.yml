name: Lab CI/CD Pipeline

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

env:
  PYTHON_VERSION: "3.8"
  AWS_REGION: ${{ secrets.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  APP_HEALTHCHECK_URL: ${{ secrets.APP_HEALTHCHECK_URL }}

jobs:
  # 1️⃣ Build & install deps
  build:
    name: Build & Install
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies (Pipfile)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipenv
          if [ -f Pipfile.lock ]; then
            pipenv install --deploy --system --dev
          else
            pipenv install --dev
          fi
          pip install flake8 bandit pytest

  # 2️⃣ Lint & security
  lint:
    name: Lint & Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run flake8 + bandit
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit
          flake8 . --ignore=E501,W503
          bandit -r . --exclude .venv -ll

  # 3️⃣ Tests with PostgreSQL
  test:
    name: Run Tests (with DB)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps & test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipenv
          if [ -f Pipfile.lock ]; then
            pipenv install --deploy --system --dev
          else:
            pipenv install --dev
          fi
          pip install pytest psycopg2-binary

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for database..."
            sleep 2
          done

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          FLASK_ENV: testing
        run: pytest -v

  # 4️⃣ Docker build & push to ECR
  docker-build:
    name: Build & Push Docker Image to ECR
    runs-on: ubuntu-latest
    needs: test

    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Public ECR
        run: |
          aws ecr-public get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin public.ecr.aws

      - name: Build Docker image
        run: |
          docker build -t public.ecr.aws/m0f2j4w8/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} .
          docker tag public.ecr.aws/m0f2j4w8/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
                     public.ecr.aws/m0f2j4w8/${{ env.ECR_REPOSITORY }}:latest

      - name: Push Docker image
        run: |
          docker push public.ecr.aws/m0f2j4w8/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          docker push public.ecr.aws/m0f2j4w8/${{ env.ECR_REPOSITORY }}:latest

  # 5️⃣ Terraform apply (infra provisioning)
  terraform-apply:
    name: Terraform Apply (Infra)
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: infra
        run: terraform init -input=false

      - name: Terraform apply
        working-directory: infra
        run: terraform apply -auto-approve -input=false

      - name: Terraform outputs
        working-directory: infra
        run: terraform output || true

  # 6️⃣ Ansible deploy (kubectl apply)
  ansible-deploy:
    name: Ansible Deploy to EKS
    runs-on: ubuntu-latest
    needs: terraform-apply

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl & Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name "${{ env.EKS_CLUSTER_NAME }}" --region "${{ env.AWS_REGION }}"
          kubectl get nodes

      - name: Run Ansible playbook
        working-directory: ansible
        run: ansible-playbook -i hosts.ini playbook.yaml

      - name: Verify pods & services
        run: |
          kubectl get pods -n "${{ env.K8S_NAMESPACE }}"
          kubectl get svc -n "${{ env.K8S_NAMESPACE }}"

  # 7️⃣ Post-deploy smoke tests
  smoke-tests:
    name: Post-deploy Smoke Tests
    runs-on: ubuntu-latest
    needs: ansible-deploy

    steps:
      - name: Hit healthcheck endpoint
        run: |
          echo "Checking ${APP_HEALTHCHECK_URL}"
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${APP_HEALTHCHECK_URL}")
            echo "Try $i → HTTP $STATUS"
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
              echo "Smoke test passed ✅"
              exit 0
            fi
            sleep 10
          done
          echo "Smoke test FAILED ❌"
          exit 1
