name: Lab CI/CD Pipeline

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

env:
  PYTHON_VERSION: '3.8'
  AWS_REGION: ap-south-1
  # ---- change these to your values / secrets ----
  ECR_REPOSITORY: flaskpostgreswithdocker      # <- repo name only
  EKS_CLUSTER_NAME: awais-devops-lab-eks
  EKS_NAMESPACE: prod

jobs:
  # 1️⃣ Build & install deps
  build:
    name: Build & Install
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps & test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipenv
          if [ -f Pipfile.lock ]; then
            pipenv install --deploy --system --dev
          else
            pipenv install --dev
          fi
          pip install flake8 bandit pytest

  # 2️⃣ Lint & security
  lint:
    name: Lint & Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipenv
          if [ -f Pipfile.lock ]; then
            pipenv install --deploy --system --dev
          else
            pipenv install --dev
          fi
          pip install flake8 bandit

      - name: Run flake8
        run: flake8 . --ignore=E501,W503

      - name: Run bandit
        run: bandit -r . --exclude .venv -ll

  # 3️⃣ Tests with PostgreSQL
  test:
    name: Run Tests (with DB)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps & test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipenv
          if [ -f Pipfile.lock ]; then
            pipenv install --deploy --system --dev
          else
            pipenv install --dev
          fi
          pip install pytest psycopg2-binary

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL..."
          for i in {1..10}; do
            nc -z localhost 5432 && echo "Postgres is up!" && exit 0
            echo "Still waiting..."
            sleep 3
          done
          echo "Postgres did not start in time"
          exit 1

      - name: Run Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          FLASK_ENV: testing
        run: |
          pytest -v

  # 4️⃣ Build & push Docker image to ECR
  docker-build:
    name: Build & Push Docker Image to ECR
    runs-on: ubuntu-latest
    needs: test
    if: success()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE_TAG=${{ github.sha }}
          IMAGE_URI=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

  # 5️⃣ Terraform apply (infra)
  terraform-apply:
    name: Terraform Apply (Infra)
    runs-on: ubuntu-latest
    needs: docker-build
    if: success()

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false

  # 6️⃣ Ansible deploy to EKS
  ansible-deploy:
    name: Ansible Deploy to EKS
    runs-on: ubuntu-latest
    needs: terraform-apply
    if: success()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible
          python -m pip install --upgrade pip
          pip install boto3 botocore

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Run Ansible playbook
        working-directory: ansible
        run: |
          ansible-playbook -i hosts.ini playbook.yaml

  # 7️⃣ Post-deploy smoke tests
  smoke-tests:
    name: Post-deploy Smoke Tests
    runs-on: ubuntu-latest
    needs: ansible-deploy
    if: success()

    env:
      APP_HEALTHCHECK_URL: ${{ secrets.APP_HEALTHCHECK_URL }}

    steps:
      - name: Check URL env
        run: |
          if [ -z "$APP_HEALTHCHECK_URL" ]; then
            echo "APP_HEALTHCHECK_URL secret is not set!"
            exit 1
          fi

      - name: Run smoke test (HTTP 200)
        run: |
          echo "Hitting: $APP_HEALTHCHECK_URL"
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$APP_HEALTHCHECK_URL" || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" -eq 200 ]; then
              echo "Smoke test passed ✅"
              exit 0
            fi
            sleep 5
          done
          echo "Smoke test failed ❌"
          exit 1
