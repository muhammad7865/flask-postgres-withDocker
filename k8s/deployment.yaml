apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
        - name: flask-app
          image: muhammad7865/flask-postgres-withdocker:latest   # change this!
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
